<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>MYFYNDA — Find it. Love it. Make it yours.</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{
  --bg:#08090b;--panel:#111318;--panel2:#17191f;--lime:#c8ff35;
  --pink:#ff8fcf;--text:#f6f7f9;--muted:#9297a3;--line:#272a31;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,Arial,sans-serif}
button,input,select,textarea{font:inherit}
button{cursor:pointer}
.top{
  position:sticky;top:0;z-index:20;background:rgba(8,9,11,.94);
  backdrop-filter:blur(18px);border-bottom:1px solid var(--line)
}
.nav{max-width:1200px;margin:auto;padding:16px 20px;display:flex;align-items:center;gap:18px}
.logo{font-size:27px;font-weight:950;letter-spacing:-1.5px}
.logo span{color:var(--lime)}
.search{flex:1;background:#17191e;border:1px solid #30333a;border-radius:14px;padding:12px 15px;color:white;outline:none}
.nav button,.btn{
  border:0;border-radius:13px;padding:11px 15px;background:var(--lime);color:#08090b;font-weight:800
}
.ghost{background:#191b20!important;color:white!important;border:1px solid #30333a!important}
.hero{max-width:1200px;margin:auto;padding:45px 20px 25px}
.hero h1{font-size:clamp(38px,7vw,76px);line-height:.95;margin:0;letter-spacing:-4px}
.hero h1 span{color:var(--lime)}
.hero p{color:var(--muted);font-size:17px;margin:18px 0 0}
.wrap{max-width:1200px;margin:auto;padding:20px}
.section-title{display:flex;justify-content:space-between;align-items:center;margin:25px 0 15px}
.section-title h2{margin:0;font-size:22px}
.categories{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.cat{
 background:var(--panel);border:1px solid var(--line);border-radius:17px;padding:20px;
 min-height:110px;text-align:left;color:white;transition:.15s
}
.cat:hover{border-color:var(--lime);transform:translateY(-2px)}
.cat .icon{font-size:27px}.cat strong{display:block;margin-top:12px}.cat small{color:var(--muted)}
.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.card img{width:100%;aspect-ratio:1;object-fit:cover;background:#191b20}
.card-body{padding:12px}.price{font-weight:900;color:var(--lime);font-size:18px}.muted{color:var(--muted);font-size:13px}
.empty{padding:50px 20px;text-align:center;color:var(--muted)}
.modal-bg{
 display:none;position:fixed;inset:0;background:rgba(0,0,0,.75);z-index:100;
 align-items:center;justify-content:center;padding:15px
}
.modal-bg.show{display:flex}
.modal{
 background:#101216;border:1px solid #30333a;border-radius:22px;width:min(720px,100%);
 max-height:92vh;overflow:auto;padding:22px
}
.modal h2{margin-top:0}
.close{float:right;background:#202329;color:white;border:0;border-radius:10px;padding:8px 11px}
.form{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.full{grid-column:1/-1}
label{font-size:12px;color:var(--muted);display:block;margin-bottom:5px}
.field{
 width:100%;background:#181a20;border:1px solid #30333a;border-radius:12px;
 color:white;padding:12px;outline:none
}
.field:focus{border-color:var(--lime)}
textarea.field{min-height:110px;resize:vertical}
.filebox{border:1px dashed #444851;border-radius:14px;padding:18px;text-align:center}
.preview{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.preview img{width:75px;height:75px;border-radius:9px;object-fit:cover}
.actions{display:flex;gap:10px;margin-top:18px}
.actions button{flex:1}
.category-path{
 display:flex;align-items:center;gap:8px;flex-wrap:wrap;
 color:var(--muted);margin-bottom:16px
}
.category-path button{background:none;border:0;color:var(--lime);padding:0}
.category-list{display:grid;gap:8px}
.category-row{
 display:flex;justify-content:space-between;align-items:center;
 padding:16px;border:1px solid var(--line);background:var(--panel);
 border-radius:13px;color:white
}
.category-row:hover{border-color:var(--lime)}
.brand-results{
 position:absolute;left:0;right:0;top:100%;background:#15171c;
 border:1px solid #363941;border-radius:12px;max-height:260px;overflow:auto;z-index:50
}
.brand-wrap{position:relative}
.brand-item{padding:11px 13px;border-bottom:1px solid #25272d;cursor:pointer}
.brand-item:hover{background:#22252c}
.badge{display:inline-block;padding:4px 8px;border-radius:8px;background:#24272d;color:var(--pink);font-size:11px}
.bottom{
 position:fixed;bottom:0;left:0;right:0;z-index:30;background:rgba(10,11,14,.95);
 border-top:1px solid var(--line);display:none;padding:9px
}
.bottom-inner{display:flex;justify-content:space-around}
.bottom button{background:none;border:0;color:#a8adb8;font-size:12px}
.bottom .sell{color:var(--lime);font-weight:900}
@media(max-width:800px){
 .nav{padding:12px}.nav .search{display:none}
 .categories{grid-template-columns:repeat(2,1fr)}
 .cards{grid-template-columns:repeat(2,1fr)}
 .hero{padding-top:30px}.form{grid-template-columns:1fr}
 .bottom{display:block}.wrap{padding-bottom:80px}
}
</style>
</head>
<body>

<header class="top">
 <div class="nav">
   <div class="logo">MY<span>FYNDA</span></div>
   <input id="mainSearch" class="search" placeholder="Search finds, brands, categories...">
   <button class="ghost" onclick="openAuth()">Account</button>
   <button onclick="openSell()">＋ Sell</button>
 </div>
</header>

<section class="hero">
 <h1>FIND IT.<br><span>LOVE IT.</span><br>MAKE IT YOURS.</h1>
 <p>A marketplace for fashion, vintage, design, collectibles and everything worth finding.</p>
</section>

<main class="wrap">

 <div class="section-title">
   <h2>Explore categories</h2>
 </div>
 <div id="categories" class="categories"></div>

 <div class="section-title">
   <h2>Latest FYNDs</h2>
   <span id="count" class="muted"></span>
 </div>
 <div id="listings" class="cards"></div>

</main>

<div class="modal-bg" id="categoryModal">
 <div class="modal">
   <button class="close" onclick="closeModal('categoryModal')">✕</button>
   <h2 id="catTitle">Categories</h2>
   <div id="categoryContent"></div>
 </div>
</div>

<div class="modal-bg" id="sellModal">
 <div class="modal">
  <button class="close" onclick="closeModal('sellModal')">✕</button>
  <h2>Sell your FYND</h2>

  <div class="form">
   <div class="full">
    <label>Title</label>
    <input id="fTitle" class="field" placeholder="What are you selling?">
   </div>

   <div>
    <label>Category</label>
    <input id="fCategory" class="field" readonly placeholder="Choose category" onclick="openCategoryPicker()">
   </div>

   <div>
    <label>Price</label>
    <input id="fPrice" class="field" type="number" min="0" step="0.01" placeholder="0.00">
   </div>

   <div>
    <label>Condition</label>
    <select id="fCondition" class="field">
     <option value="">Select condition</option>
     <option>New with tags</option>
     <option>New without tags</option>
     <option>Very good</option>
     <option>Good</option>
     <option>Satisfactory</option>
     <option>Antique / collectible</option>
    </select>
   </div>

   <div>
    <label>Size</label>
    <input id="fSize" class="field" placeholder="e.g. M / 38 / 10">
   </div>

   <div class="full brand-wrap">
    <label>Brand</label>
    <input id="brandInput" class="field" autocomplete="off"
      placeholder="Search and choose a brand..."
      oninput="searchBrands(this.value)"
      onclick="searchBrands(this.value)">
    <div id="brandResults" class="brand-results" style="display:none"></div>
   </div>

   <div>
    <label>Colour</label>
    <input id="fColor" class="field" placeholder="Black">
   </div>

   <div>
    <label>Material</label>
    <input id="fMaterial" class="field" placeholder="Leather, cotton...">
   </div>

   <div>
    <label>Measurements</label>
    <input id="fMeasurements" class="field" placeholder="Optional">
   </div>

   <div>
    <label>Origin / Period</label>
    <input id="fOrigin" class="field" placeholder="France, 1970s...">
   </div>

   <div class="full">
    <label>Photos — up to 8</label>
    <div class="filebox">
      <input id="photos" type="file" accept="image/*" multiple>
      <div id="preview" class="preview"></div>
    </div>
   </div>

   <div class="full">
    <label>Description</label>
    <textarea id="fDescription" class="field" placeholder="Describe your item..."></textarea>
   </div>
  </div>

  <div class="actions">
   <button class="ghost btn" onclick="closeModal('sellModal')">Cancel</button>
   <button class="btn" onclick="publishListing()">Publish FYND</button>
  </div>
 </div>
</div>

<div class="modal-bg" id="authModal">
 <div class="modal">
  <button class="close" onclick="closeModal('authModal')">✕</button>
  <h2>MYFYNDA Account</h2>
  <div class="form">
   <div class="full">
    <label>Email</label>
    <input id="authEmail" class="field" type="email" placeholder="you@email.com">
   </div>
   <div class="full">
    <label>Password</label>
    <input id="authPassword" class="field" type="password" placeholder="Password">
   </div>
  </div>
  <div class="actions">
   <button class="ghost btn" onclick="signUp()">Create account</button>
   <button class="btn" onclick="signIn()">Sign in</button>
  </div>
  <p id="authStatus" class="muted"></p>
 </div>
</div>

<div class="modal-bg" id="pickerModal">
 <div class="modal">
  <button class="close" onclick="closeModal('pickerModal')">✕</button>
  <h2>Choose category</h2>
  <div id="pickerContent"></div>
 </div>
</div>

<nav class="bottom">
 <div class="bottom-inner">
  <button onclick="window.scrollTo({top:0,behavior:'smooth'})">⌂<br>Home</button>
  <button onclick="showAll()">⌕<br>Search</button>
  <button class="sell" onclick="openSell()">＋<br>Sell</button>
  <button onclick="openAuth()">♙<br>Account</button>
 </div>
</nav>

let selectedBrand="";

const BRAND_LIST=[...new Set(BRANDS.split("|").map(x=>x.trim()).filter(Boolean))].sort((a,b)=>a.localeCompare(b));

/* =========================
   UI
   ========================= */

function renderCategories(){
 const box=document.getElementById("categories");
 box.innerHTML="";
 Object.entries(CATEGORIES).forEach(([name,data])=>{
   const b=document.createElement("button");
   b.className="cat";
   b.innerHTML=`<div class="icon">${data.icon}</div><strong>${name}</strong><small>${Object.keys(data.children).length} sections</small>`;
   b.onclick=()=>openCategory(name);
   box.appendChild(b);
 });
}

function openCategory(name){
 const data=CATEGORIES[name];
 document.getElementById("catTitle").textContent=name;
 const content=document.getElementById("categoryContent");
 content.innerHTML=`
  <div class="category-path">
   <button onclick="closeModal('categoryModal')">Home</button> / ${name}
  </div>
  <div class="category-list" id="subcats"></div>`;
 const sub=document.getElementById("subcats");
 Object.entries(data.children).forEach(([subname,items])=>{
   const row=document.createElement("button");
   row.className="category-row";
   row.innerHTML=`<span><strong>${subname}</strong><br><small class="muted">${items.length} options</small></span><span>›</span>`;
   row.onclick=()=>openSubCategory(name,subname,items);
   sub.appendChild(row);
 });
 document.getElementById("categoryModal").classList.add("show");
}

function openSubCategory(parent,sub,items){
 const content=document.getElementById("categoryContent");
 content.innerHTML=`
  <div class="category-path">
   <button onclick="openCategory('${escapeAttr(parent)}')">${parent}</button> /
   ${sub}
  </div>
  <div class="category-list" id="thirdcats"></div>`;
 const box=document.getElementById("thirdcats");
 items.forEach(item=>{
  const row=document.createElement("button");
  row.className="category-row";
  row.innerHTML=`<span>${item}</span><span>›</span>`;
  row.onclick=()=>{
   selectedCategory=`${parent} › ${sub} › ${item}`;
   document.getElementById("fCategory").value=selectedCategory;
   closeModal("categoryModal");
   closeModal("pickerModal");
  };
  box.appendChild(row);
 });
}

function openCategoryPicker(){
 document.getElementById("pickerContent").innerHTML="";
 Object.entries(CATEGORIES).forEach(([name,data])=>{
  const row=document.createElement("button");
  row.className="category-row";
  row.innerHTML=`<span>${data.icon} &nbsp; ${name}</span><span>›</span>`;
  row.onclick=()=>openPickerSub(name);
  document.getElementById("pickerContent").appendChild(row);
 });
 document.getElementById("pickerModal").classList.add("show");
}

function openPickerSub(name){
 const data=CATEGORIES[name];
 const box=document.getElementById("pickerContent");
 box.innerHTML=`<div class="category-path"><button onclick="openCategoryPicker()">‹ Back</button> / ${name}</div>`;
 Object.entries(data.children).forEach(([sub,items])=>{
  const row=document.createElement("button");
  row.className="category-row";
  row.innerHTML=`<span>${sub}</span><span>›</span>`;
  row.onclick=()=>{
   selectedCategory=`${name} › ${sub}`;
   document.getElementById("fCategory").value=selectedCategory;
   closeModal("pickerModal");
  };
  box.appendChild(row);
 });
}

function searchBrands(q){
 const box=document.getElementById("brandResults");
 const term=(q||"").toLowerCase().trim();
 const arr=term?BRAND_LIST.filter(b=>b.toLowerCase().includes(term)):BRAND_LIST.slice(0,80);
 box.innerHTML="";
 arr.slice(0,80).forEach(brand=>{
  const div=document.createElement("div");
  div.className="brand-item";
  div.textContent=brand;
  div.onclick=()=>{
   selectedBrand=brand;
   document.getElementById("brandInput").value=brand;
   box.style.display="none";
  };
  box.appendChild(div);
 });
 box.style.display="block";
}

document.addEventListener("click",e=>{
 if(!e.target.closest(".brand-wrap"))document.getElementById("brandResults").style.display="none";
});

function escapeAttr(x){return String(x).replace(/'/g,"\\'")}

function openSell(){
 document.getElementById("sellModal").classList.add("show");
}

function openAuth(){
 document.getElementById("authModal").classList.add("show");
}

function closeModal(id){
 document.getElementById(id).classList.remove("show");
}

/* =========================
   PHOTO PREVIEW
   ========================= */

document.getElementById("photos").addEventListener("change",e=>{
 const box=document.getElementById("preview");
 box.innerHTML="";
 [...e.target.files].slice(0,8).forEach(file=>{
  const img=document.createElement("img");
  img.src=URL.createObjectURL(file);
  box.appendChild(img);
 });
});

/* =========================
   AUTH
   ========================= */

async function signUp(){
 const email=document.getElementById("authEmail").value.trim();
 const password=document.getElementById("authPassword").value;
 if(!email||!password)return status("Enter email and password.");
 const {error}=await sb.auth.signUp({email,password});
 document.getElementById("authStatus").textContent=error?error.message:"Account created. Check your email if confirmation is required.";
}

async function signIn(){
 const email=document.getElementById("authEmail").value.trim();
 const password=document.getElementById("authPassword").value;
 const {error}=await sb.auth.signInWithPassword({email,password});
 if(error)status(error.message);
 else{
  status("Signed in successfully.");
  setTimeout(()=>closeModal("authModal"),700);
 }
}

function status(x){document.getElementById("authStatus").textContent=x}

/* =========================
   PUBLISH
   ========================= */

async function publishListing(){
 const {data:{user}}=await sb.auth.getUser();
 if(!user){
  alert("Please sign in first.");
  openAuth();
  return;
 }

 const title=document.getElementById("fTitle").value.trim();
 const category=document.getElementById("fCategory").value.trim();
 const price=parseFloat(document.getElementById("fPrice").value);
 const description=document.getElementById("fDescription").value.trim();

 if(!title||!category||Number.isNaN(price)||!description){
  alert("Please complete Title, Category, Price and Description.");
  return;
 }

 const files=[...document.getElementById("photos").files].slice(0,8);
 const urls=[];

 for(const file of files){
  const safe=file.name.replace(/[^a-zA-Z0-9._-]/g,"_");
  const path=`${user.id}/${Date.now()}_${Math.random().toString(36).slice(2)}_${safe}`;

  const {error}=await sb.storage.from("listing-photos").upload(path,file,{
   cacheControl:"3600",upsert:false
  });

  if(error){
   alert("Photo upload error: "+error.message);
   return;
  }

  const {data}=sb.storage.from("listing-photos").getPublicUrl(path);
  urls.push(data.publicUrl);
 }

 const payload={
  seller_id:user.id,
  title,
  category,
  price,
  condition:document.getElementById("fCondition").value||null,
  size:document.getElementById("fSize").value.trim()||null,
  brand:selectedBrand||document.getElementById("brandInput").value.trim()||null,
  color:document.getElementById("fColor").value.trim()||null,
  material:document.getElementById("fMaterial").value.trim()||null,
  measurements:document.getElementById("fMeasurements").value.trim()||null,
  origin:document.getElementById("fOrigin").value.trim()||null,
  description,
  photos:urls,
  status:"active"
 };

 const {error}=await sb.from("listings").insert(payload);

 if(error){
  alert("Publish error: "+error.message);
  console.error(error);
  return;
 }

 alert("Your FYND has been published! 💚");
 closeModal("sellModal");
 clearSell();
 loadListings();
}

function clearSell(){
 ["fTitle","fCategory","fPrice","fSize","brandInput","fColor","fMaterial","fMeasurements","fOrigin","fDescription"].forEach(id=>{
  document.getElementById(id).value="";
 });
 document.getElementById("photos").value="";
 document.getElementById("preview").innerHTML="";
 selectedBrand="";
 selectedCategory="";
}

/* =========================
   LISTINGS
   ========================= */

async function loadListings(search=""){
 let query=sb.from("listings")
  .select("*")
  .eq("status","active")
  .order("created_at",{ascending:false})
  .limit(40);

 const {data,error}=await query;

 if(error){
  console.error(error);
  document.getElementById("listings").innerHTML=
   `<div class="empty">Could not load FYNDs.<br><small>${error.message}</small></div>`;
  return;
 }

 let rows=data||[];

 if(search){
  const s=search.toLowerCase();
  rows=rows.filter(x=>
   [x.title,x.brand,x.category,x.description,x.origin]
   .filter(Boolean).join(" ").toLowerCase().includes(s)
  );
 }

 document.getElementById("count").textContent=`${rows.length} FYNDs`;

 const box=document.getElementById("listings");

 if(!rows.length){
  box.innerHTML=`<div class="empty">No FYNDs found yet.</div>`;
  return;
 }

 box.innerHTML=rows.map(item=>{
  const photos=Array.isArray(item.photos)?item.photos:[];
  const img=photos[0]||"";
  return `
   <article class="card">
    ${img?`<img src="${img}" alt="">`:`<div style="aspect-ratio:1;background:#191b20;display:grid;place-items:center;color:#666">MYFYNDA</div>`}
    <div class="card-body">
     <div class="price">€${Number(item.price||0).toFixed(2)}</div>
     <strong>${escapeHtml(item.title)}</strong>
     <div class="muted">${escapeHtml(item.brand||"Unbranded")}</div>
     <div class="muted">${escapeHtml(item.category||"")}</div>
    </div>
   </article>`;
 }).join("");
}

function escapeHtml(x){
 return String(x).replace(/[&<>"']/g,m=>({
  "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"
 }[m]));
}

function showAll(){
 document.getElementById("mainSearch").value="";
 loadListings();
}

document.getElementById("mainSearch").addEventListener("input",e=>{
 loadListings(e.target.value);
});

/* =========================
   START
   ========================= */

renderCategories();
loadListings();

sb.auth.onAuthStateChange((_event,session)=>{
 console.log("MYFYNDA auth:",!!session);
});
</script>
